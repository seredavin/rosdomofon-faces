schema: spec-driven

context: |
  Веб-сервис для просмотра камер домофона Росдомофон с поиском и распознаванием лиц.
  Стек: Python 3.13, FastAPI + uvicorn, PyAV (чтение HLS), OpenCV (YuNet — детекция,
  SFace — распознавание), httpx, ванильный HTML/JS без сборки (app/static/index.html).
  Сервер пока слушает только localhost, своей авторизации нет.
  Данные (токены, база лиц) — локально в data/, не коммитятся.
  Камеры смотрят на общий подъезд: лица соседей — биометрия (152-ФЗ), храним минимум.
  Язык артефактов, комментариев в коде и сообщений коммитов — русский.

